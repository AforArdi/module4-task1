<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Task 1</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="search-box">
            <h3>seach your image here: </h3>
            <input type="search" name="search-image" id="search-image">
            <input id="btn-search" type="button" value="Search">
        </div>
    </header>

    <main>
        <div class="panda-pic">
            <img id="panda-kick" src="/images/panda-kick.jpg" alt="Panda Kicks">
            <p><a href="#">For more info click here</a></p>
        </div>
        <hr>
        <section class="form">
            <h3>Feedback Form</h3>
            <div class="form-row">
                <label for="name">Name: </label>
            <input type="text" id="name" name="name">
            </div>

            <div class="form-row">
                <label for="date">Date</label>
                <input type="date" name="date" id="date">
            </div>

            <div class="form-row">
                <label for="comment">Comment</label>
                <textarea name="comment" id="comment"></textarea>
            </div>

            <input type="button" value="Submit" id="btn-submit">

        </section>
    </main>

    <footer>
        <p><small>&copy; 2025 Task 1</small></p>
    </footer>
</body>
</html>
